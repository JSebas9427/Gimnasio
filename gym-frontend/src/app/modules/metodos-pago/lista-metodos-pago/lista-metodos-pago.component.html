<div class="page-header">
  <h2>Métodos de pago</h2>
  <button mat-raised-button color="primary" (click)="abrirFormulario()">
    <mat-icon>add</mat-icon> Nuevo método
  </button>
</div>

<div class="spinner-wrap" *ngIf="cargando">
  <mat-spinner diameter="40"></mat-spinner>
</div>

<mat-card [hidden]="cargando">
  <mat-card-content>
    <table mat-table [dataSource]="metodos" class="full-width">

      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef>Nombre</th>
        <td mat-cell *matCellDef="let m"><strong>{{ m.nombre }}</strong></td>
      </ng-container>

      <ng-container matColumnDef="descripcion">
        <th mat-header-cell *matHeaderCellDef>Descripción</th>
        <td mat-cell *matCellDef="let m">{{ m.descripcion || '—' }}</td>
      </ng-container>

      <ng-container matColumnDef="activo">
        <th mat-header-cell *matHeaderCellDef>Activo</th>
        <td mat-cell *matCellDef="let m">
          <mat-slide-toggle color="primary" [checked]="m.activo" (change)="cambiarEstado(m)"
                            [matTooltip]="m.activo ? 'Disponible al facturar' : 'Oculto al facturar'">
          </mat-slide-toggle>
        </td>
      </ng-container>

      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let m">
          <button mat-icon-button color="primary" matTooltip="Editar" (click)="abrirFormulario(m)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" matTooltip="Eliminar" (click)="eliminar(m)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columnas"></tr>
      <tr mat-row *matRowDef="let row; columns: columnas;" [class.inactivo]="!row.activo"></tr>

    </table>

    <p *ngIf="!cargando && metodos.length === 0" class="empty">No hay métodos de pago registrados.</p>
    <p class="nota">
      <mat-icon>info_outline</mat-icon>
      Un método que ya se usó en facturas no se puede eliminar: desactívalo para que no aparezca al facturar.
    </p>
  </mat-card-content>
</mat-card>
